name: Check OSS transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check oss2==2.19.1
      - name: Install verified ossutil
        run: bash .github/scripts/install-ossutil.sh
      - name: Compare runner TCP algorithms
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          original=$(sysctl -n net.ipv4.tcp_congestion_control)
          trap 'sudo sysctl -w net.ipv4.tcp_congestion_control="$original"' EXIT
          uname -r
          sysctl net.ipv4.tcp_congestion_control
          OSS_TRANSPORT="$original" python -u .github/scripts/check-oss.py
          sudo modprobe tcp_bbr
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          OSS_TRANSPORT=bbr python -u .github/scripts/check-oss.py
