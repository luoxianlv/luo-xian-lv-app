name: Deploy stable update

on:
  workflow_dispatch:
    inputs:
      oss_run_id:
        description: 成功的 Upload Release to OSS 运行 ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-stable
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.repository == 'luoxianlv/luo-xian-lv-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify manifest provenance
        env:
          OSS_RUN_ID: ${{ inputs.oss_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$OSS_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OSS_RUN_ID" > /tmp/oss-run.json
          python .github/scripts/validate-oss-run.py /tmp/oss-run.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-stable
          path: dist
          run-id: ${{ inputs.oss_run_id }}
          github-token: ${{ github.token }}
      - name: Deploy verified stable manifest
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy-update.sh
