name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Test release scripts
        run: |
          python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
          python -m unittest discover -s .github/tests -v
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: actionlint
        with:
          path: ~/.cache/luoxianlv/actionlint
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-1.7.7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.actionlint.outputs.cache-hit != 'true'
        with:
          go-version: '1.24'
          cache: false
      - name: Install workflow checker
        if: steps.actionlint.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/.cache/luoxianlv/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check workflow syntax
        run: '"$HOME/.cache/luoxianlv/actionlint/actionlint"'
      - name: 检查安装签名解析边界
        shell: pwsh
        run: ./tools/test-native-apk-signature.ps1
      - name: 验证触屏协议与合流模型
        run: |
          cmake -S modules/input-core/src/main/cpp -B build/input-model -DCMAKE_BUILD_TYPE=Release
          cmake --build build/input-model --parallel 2
          ctest --test-dir build/input-model --output-on-failure

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android-build
        with:
          profile: native-debug
          read_only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test and build debug host
        run: |
          source .github/scripts/gradle-ci-args.sh
          configure_ci_gradle
          bash ./gradlew :buildSrc:test :app:testDebugUnitTest :hot-core:testDebugUnitTest \
            :app-runtime:testDebugUnitTest :input-core:testDebugUnitTest :update-core:testDebugUnitTest :app-host:assembleDebug \
            "${ci_gradle_args[@]}" --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: modules/app-host/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  native:
    name: 原生热更三层核验
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
        with:
          profile: native
          read_only: ${{ github.ref != 'refs/heads/main' }}
      - name: 构建优化三层产物
        run: |
          python tools/verify-update-vendor.py
          source .github/scripts/gradle-ci-args.sh
          configure_ci_gradle
          bash ./gradlew :app-host:exportReleaseNativeBuildReport -PnativeOptimize=true \
            "${ci_gradle_args[@]}" --stacktrace
      - name: 检查实际 SDK、资源和 R8 映射
        shell: pwsh
        run: ./tools/verify-native-release.ps1 -ExpectOptimized -CompileOnly
      - name: 保存原生热更核验报告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-audit
          path: |
            modules/app-host/build/native-release-verification.json
            modules/app-host/build/native-report/release/
            modules/app-runtime/build/native-report/release/
            modules/app-business/build/native-report/release/
          if-no-files-found: error
          retention-days: 14
