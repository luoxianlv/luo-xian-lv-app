name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布的已有版本标签（如 v1.0.1）
        required: true
        type: string
      skip_tests:
        description: 本地已测过，跳过单元测试（保留打包和校验）
        required: true
        default: false
        type: boolean
      native_package:
        description: 使用三层原生宿主（需要配置公开热更配置；旧标签保持关闭）
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tests:
    if: >-
      github.repository == 'luoxianlv/luo-xian-lv-app' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main') &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
        with:
          source_dir: source
          profile: native-tests
      - name: Run unit tests
        working-directory: source
        env:
          NATIVE_RELEASE_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_package && 'true' || 'false') || vars.NATIVE_RELEASE_DEFAULT || 'false' }}
        run: |
          if [[ ! -f modules/app-host/build.gradle.kts && ! -f app-host/build.gradle.kts ]]; then
            export NATIVE_RELEASE_PACKAGE=false
          fi
          bash "$GITHUB_WORKSPACE/.github/scripts/release-tests.sh"

  package:
    if: github.repository == 'luoxianlv/luo-xian-lv-app' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      # 脚本跟随工作流版本，APP 源码单独检出标签，旧标签也能使用新流程。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          path: source
          persist-credentials: false
      - name: Resolve package route
        id: package_route
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          MANUAL_NATIVE: ${{ inputs.native_package && 'true' || 'false' }}
          DEFAULT_NATIVE: ${{ vars.NATIVE_RELEASE_DEFAULT }}
        run: |
          native=false
          if [[ "$RELEASE_EVENT" == workflow_dispatch ]]; then
            native="$MANUAL_NATIVE"
          elif [[ "$DEFAULT_NATIVE" == true && ( -f source/modules/app-host/build.gradle.kts || -f source/app-host/build.gradle.kts ) ]]; then
            native=true
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-android-build
        with:
          source_dir: source
          profile: ${{ steps.package_route.outputs.native == 'true' && 'native' || 'legacy' }}
      - name: Build and verify signed APK
        working-directory: source
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          RELEASE_TESTS_EXTERNAL: 'true'
          RELEASE_SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests && 'true' || 'false' }}
          NATIVE_RELEASE_PACKAGE: ${{ steps.package_route.outputs.native }}
          NATIVE_HOT_CONFIG_JSON: ${{ vars.NATIVE_HOT_CONFIG_JSON }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/package-release.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: source/dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-mapping
          path: |
            source/app/build/outputs/mapping/release/mapping.txt
            source/native-release-artifacts/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [tests, package]
    # 只有显式手动跳过才允许 tests=skipped；失败和取消不能发布。
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      (needs.tests.result == 'success' ||
       (needs.tests.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_tests))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: dist
      - name: Publish GitHub release
        run: bash .github/scripts/publish-github.sh
