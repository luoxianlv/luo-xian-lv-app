name: 原生签名包准备

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 候选版本号（只生成验收产物，不发布）
        required: true
        default: '1.0.10'
        type: string
      version_code:
        description: 候选版本代码（须高于已发布版本）
        required: true
        default: '17'
        type: string

permissions:
  contents: read

concurrency:
  group: native-signed-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'luoxianlv/luo-xian-lv-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: 检查候选版本
        env:
          CANDIDATE_VERSION: ${{ inputs.version_name }}
          CANDIDATE_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ ${#CANDIDATE_CODE} -le 10 ]]
          base_code=$(sed -nE 's/^val appVersionCode.*\?: ([0-9]+).*$/\1/p' app/build.gradle.kts)
          [[ "$base_code" =~ ^[1-9][0-9]*$ ]]
          (( CANDIDATE_CODE >= base_code && CANDIDATE_CODE <= 2100000000 ))
      - name: 生成正式签名的原生验收包
        env:
          RELEASE_TAG: v${{ inputs.version_name }}
          ORG_GRADLE_PROJECT_appVersionName: ${{ inputs.version_name }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          NATIVE_RELEASE_PACKAGE: 'true'
          NATIVE_HOT_CONFIG_JSON: ${{ vars.NATIVE_HOT_CONFIG_JSON }}
        run: bash .github/scripts/package-release.sh
      - name: 保存签名验收包与公开核验资料
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-signed-candidate-${{ inputs.version_name }}
          path: |
            dist/
          if-no-files-found: warn
          retention-days: 30
      - name: 保存三层 SDK、映射与失败诊断
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-signed-evidence-${{ inputs.version_name }}
          path: |
            native-release-artifacts/
            app-host/build/outputs/apk/release/*.apk
            app-host/build/native-release-verification.json
          if-no-files-found: warn
          retention-days: 30
