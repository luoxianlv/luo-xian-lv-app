name: 原生签名包准备

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 可选正式源码标签（如 v1.3.0）；留空构建当前 main，仅生成候选包
        required: false
        default: ''
        type: string
      skip_tests:
        description: 本地已测过，跳过单元测试（保留打包和校验）
        required: true
        default: false
        type: boolean
      version_name:
        description: 候选版本号（只生成验收产物，不发布）
        required: true
        default: '1.2.0'
        type: string
      version_code:
        description: 候选版本代码（须高于已发布版本）
        required: true
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: native-signed-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'luoxianlv/luo-xian-lv-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate selected source
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: '[[ -z "$SOURCE_TAG" || "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_tag || github.sha }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
        with:
          source_dir: source
          profile: native
          read_only: 'false'
      - name: 检查候选版本
        working-directory: source
        env:
          CANDIDATE_VERSION: ${{ inputs.version_name }}
          CANDIDATE_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ ${#CANDIDATE_CODE} -le 10 ]]
          base_code=$(sed -nE 's/^appVersionCode=([0-9]+)$/\1/p' gradle.properties)
          [[ "$base_code" =~ ^[1-9][0-9]*$ ]]
          (( CANDIDATE_CODE >= base_code && CANDIDATE_CODE <= 2100000000 ))
      - name: 生成正式签名的原生验收包
        working-directory: source
        env:
          RELEASE_TAG: v${{ inputs.version_name }}
          ORG_GRADLE_PROJECT_appVersionName: ${{ inputs.version_name }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          RELEASE_SKIP_TESTS: ${{ inputs.skip_tests && 'true' || 'false' }}
          NATIVE_RELEASE_PACKAGE: 'true'
          NATIVE_HOT_CONFIG_JSON: ${{ vars.NATIVE_HOT_CONFIG_JSON }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/package-release.sh"
      - name: 保存签名验收包与公开核验资料
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-signed-candidate-${{ inputs.version_name }}
          path: |
            source/dist/
          if-no-files-found: warn
          retention-days: 30
      - name: 保存三层 SDK、映射与失败诊断
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-signed-evidence-${{ inputs.version_name }}
          path: |
            source/native-release-artifacts/
            source/modules/app-host/build/outputs/apk/release/*.apk
            source/modules/app-host/build/native-release-verification.json
          if-no-files-found: warn
          retention-days: 30
