name: Upload Release to OSS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已发布的 GitHub Release 标签（如 v1.0.8）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oss-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    if: github.repository == 'luoxianlv/luo-xian-lv-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download and verify published release
        run: python .github/scripts/release_package.py
      - name: Install OSS SDK
        run: python -m pip install --disable-pip-version-check oss2==2.19.1
      - name: Prepare upload network
        run: bash .github/scripts/prepare-oss-network.sh
      - name: Multipart upload and verify download
        timeout-minutes: 15
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: python -u .github/scripts/publish-oss.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-stable
          path: dist/stable.json
          if-no-files-found: error
          retention-days: 30
      - name: Deployment instructions
        run: |
          printf 'OSS 校验通过。运行 Deploy stable update，oss_run_id 填写 %s。\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
