name: Upload Release to official storage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已发布的 GitHub Release 标签（如 v1.0.8）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oss-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    if: github.repository == 'luoxianlv/luo-xian-lv-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      DOWNLOAD_PROVIDER: ${{ vars.DOWNLOAD_PROVIDER || 'oss' }}
      UPDATE_INCREMENTAL_PREPARE: ${{ vars.UPDATE_INCREMENTAL_PREPARE || 'false' }}
      UPDATE_ROOT_PUBLIC_JSON: ${{ vars.UPDATE_ROOT_PUBLIC_JSON }}
      UPDATE_TRUST_JSON: ${{ vars.UPDATE_TRUST_JSON }}
      UPDATE_TRUST_SIGNATURE_JSON: ${{ vars.UPDATE_TRUST_SIGNATURE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate selected storage provider
        run: |
          case "$DOWNLOAD_PROVIDER" in
            oss|r2|cf) ;;
            *) printf '::error::DOWNLOAD_PROVIDER must be oss or r2.\n' >&2; exit 1 ;;
          esac
      - name: Download and verify published release
        run: python .github/scripts/release_package.py
      - name: Validate incremental tooling revision
        if: env.UPDATE_INCREMENTAL_PREPARE == 'true' && env.UPDATE_ROOT_PUBLIC_JSON != ''
        env:
          UPDATE_TOOLS_REF: ${{ vars.UPDATE_TOOLS_REF }}
        run: '[[ "$UPDATE_TOOLS_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.UPDATE_INCREMENTAL_PREPARE == 'true' && env.UPDATE_ROOT_PUBLIC_JSON != ''
        with:
          repository: luoxianlv/luo-xian-lv-hot-update
          ref: ${{ vars.UPDATE_TOOLS_REF }}
          token: ${{ secrets.HOT_UPDATE_REPO_TOKEN }}
          path: incremental-tools
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.UPDATE_INCREMENTAL_PREPARE == 'true' && env.UPDATE_ROOT_PUBLIC_JSON != ''
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: env.UPDATE_INCREMENTAL_PREPARE == 'true' && env.UPDATE_ROOT_PUBLIC_JSON != ''
        with:
          distribution: temurin
          java-version: '21'
      - name: Build pinned incremental tools
        if: env.UPDATE_INCREMENTAL_PREPARE == 'true' && env.UPDATE_ROOT_PUBLIC_JSON != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lxupdate-tools"
          (cd incremental-tools && go test ./pkg/update ./pkg/signing ./internal/updatecli && go build -o "$RUNNER_TEMP/lxupdate-tools/lxupdate" ./cmd/lxupdate)
          export LXUPDATE_BIN="$RUNNER_TEMP/lxupdate-tools/lxupdate"
          bash .github/scripts/build-hdiff-tools.sh "$RUNNER_TEMP/lxupdate-tools"
          printf 'LXUPDATE_BIN=%s\nHDIFFZ=%s\nHPATCHZ=%s\nHDIFF_LOCK=%s\n' \
            "$LXUPDATE_BIN" "$RUNNER_TEMP/lxupdate-tools/hdiffz" "$RUNNER_TEMP/lxupdate-tools/hpatchz" "$RUNNER_TEMP/lxupdate-tools/tools-lock.json" >> "$GITHUB_ENV"
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          [[ -x "$sdk_tools/aapt" && -x "$sdk_tools/apksigner" ]]
          printf 'ANDROID_AAPT=%s\nANDROID_APKSIGNER=%s\n' "$sdk_tools/aapt" "$sdk_tools/apksigner" >> "$GITHUB_ENV"
      - name: Prepare signed direct APK patches
        env:
          UPDATE_CONTENT_KEY_BASE64: ${{ secrets.UPDATE_CONTENT_KEY_BASE64 }}
          UPDATE_CONTENT_KEY_PASSWORD: ${{ secrets.UPDATE_CONTENT_KEY_PASSWORD }}
        run: python .github/scripts/prepare_incremental.py
      - name: Install upload SDKs
        run: python -m pip install --disable-pip-version-check oss2==2.19.1 boto3==1.43.108
      - name: Prepare upload network
        if: env.DOWNLOAD_PROVIDER == 'oss'
        run: bash .github/scripts/prepare-oss-network.sh
      - name: Multipart upload to OSS and verify download
        if: env.DOWNLOAD_PROVIDER == 'oss'
        timeout-minutes: 15
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: python -u .github/scripts/publish-oss.py
      - name: Multipart upload to private R2 and verify readback
        if: env.DOWNLOAD_PROVIDER == 'r2' || env.DOWNLOAD_PROVIDER == 'cf'
        timeout-minutes: 15
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: python -u .github/scripts/publish-oss.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-stable
          path: dist/stable.json
          if-no-files-found: error
          retention-days: 30
      - name: Deployment instructions
        run: |
          printf '官方存储校验通过。运行 Deploy stable update，oss_run_id 填写 %s。\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
