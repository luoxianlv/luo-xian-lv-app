name: 提个建议
description: 希望增加什么，或者哪里可以改进
labels: [enhancement]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: 你的建议
      placeholder: 一句话也可以。
    validations:
      required: false
  - type: textarea
    id: use
    attributes:
      label: 什么时候会用到？
      description: 有想法可以补充，没有就留空。
    validations:
      required: false
