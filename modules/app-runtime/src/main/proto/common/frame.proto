syntax = "proto3";
package luoxianlv.realtime.v1;
option java_package = "app.luoxianlv.runtime.realtime.proto";

import "control/system_hello.proto";
import "control/system_ping.proto";
import "control/system_result.proto";
import "control/system_maintenance.proto";
import "control/account_authorize.proto";
import "control/account_clear.proto";
import "control/account_result.proto";
import "control/hot_subscribe.proto";
import "control/hot_unsubscribe.proto";
import "control/hot_result.proto";
import "control/hot_changed.proto";
import "control/catalog_changed.proto";
import "control/business_changed.proto";
import "query/request.proto";
import "query/continue.proto";
import "query/cancel.proto";
import "query/chunk.proto";
import "ensemble/create.proto";
import "ensemble/join.proto";
import "ensemble/current.proto";
import "ensemble/snapshot.proto";
import "ensemble/leave.proto";
import "ensemble/kick.proto";
import "ensemble/assign.proto";
import "ensemble/ready.proto";
import "ensemble/stop.proto";
import "ensemble/pause.proto";
import "ensemble/start.proto";
import "ensemble/restart.proto";
import "ensemble/resume.proto";
import "ensemble/rejoin.proto";
import "ensemble/ack.proto";
import "ensemble/executed.proto";
import "ensemble/score_authorize.proto";
import "ensemble/command_result.proto";
import "ensemble/changed.proto";
import "ensemble/result.proto";
import "common/error.proto";

// One binary WebSocket message carries one frame. Field numbers are permanent.
message Frame {
  uint32 protocol_version = 1;
  string message_id = 2;
  string connection_epoch = 3;
  oneof content {
    Failure error = 4;
    SystemHelloData system_hello = 10;
    SystemPingData system_ping = 11;
    SystemResultData system_result = 12;
    SystemMaintenanceData system_maintenance = 13;
    AccountAuthorizeData account_authorize = 14;
    AccountClearData account_clear = 15;
    AccountResultData account_result = 16;
    HotSubscribeData hot_subscribe = 17;
    HotUnsubscribeData hot_unsubscribe = 18;
    HotResultData hot_result = 19;
    HotChangedData hot_changed = 20;
    CatalogChangedData catalog_changed = 21;
    BusinessChangedData business_changed = 22;
    QueryRequestData query_request = 30;
    QueryContinueData query_continue = 31;
    QueryCancelData query_cancel = 32;
    QueryChunkData query_chunk = 33;
    EnsembleCreateData ensemble_create = 40;
    EnsembleJoinData ensemble_join = 41;
    EnsembleCurrentData ensemble_current = 42;
    EnsembleSnapshotData ensemble_snapshot = 43;
    EnsembleLeaveData ensemble_leave = 44;
    EnsembleKickData ensemble_kick = 45;
    EnsembleAssignData ensemble_assign = 46;
    EnsembleReadyData ensemble_ready = 47;
    EnsembleStopData ensemble_stop = 48;
    EnsemblePauseData ensemble_pause = 49;
    EnsembleStartData ensemble_start = 50;
    EnsembleRestartData ensemble_restart = 51;
    EnsembleResumeData ensemble_resume = 52;
    EnsembleRejoinData ensemble_rejoin = 53;
    EnsembleAckData ensemble_ack = 54;
    EnsembleExecutedData ensemble_executed = 55;
    EnsembleScoreAuthorizeData ensemble_score_authorize = 56;
    EnsembleCommandResultData ensemble_command_result = 57;
    EnsembleChangedData ensemble_changed = 58;
    EnsembleResultData ensemble_result = 59;
  }
}
