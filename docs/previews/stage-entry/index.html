<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b5d7e5">
  <title>落弦律 · 演练场</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M10 17V5l10-2v12M10 9l10-2"/><ellipse cx="7" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M5 4H3v17h15v-2M7 2h14v15H7zM13 12V6h4"/><path d="M13 12c0 3-5 3-5 0s5-3 5 0"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 2 3-1 3 1 4-2v-4l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="11" r="3"/></symbol>
  <symbol id="i-tune" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18M8 3v6m8 0v6m-6 0v6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 5-5 4 3 3-5 5 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>

<div id="device" class="device">
<main id="frame" class="frame" data-state="home" aria-label="落弦律">
  <div class="stage-background" id="stage-background" aria-hidden="true">
    <video id="wallpaper-video" src="/assets/day.mp4" poster="/assets/poster.jpg" preload="none" loop muted playsinline></video>
    <img id="wallpaper-image" alt="" src="/assets/sunset.jpg">
    <div class="stage-shade"></div>
  </div>

  <div id="home" class="home">
    <div class="status-bar"><span id="system-time">14:26</span><div class="status-icons"><span class="cellular"><i></i><i></i><i></i><i></i></span><svg viewBox="0 0 20 15"><path d="M2 5q8-6 16 0M5 8q5-4 10 0M8 11q2-2 4 0"/></svg><span class="status-battery"></span></div></div>
    <aside class="rail">
      <div class="rail-clock"><span id="hour">14</span><i></i><span id="minute">26</span></div>
      <div class="battery"><div>ϟ</div><small>100%</small></div>
      <nav aria-label="主导航">
        <button class="rail-button" data-page="library" aria-label="曲库"><svg><use href="#i-library"/></svg></button><span class="rail-rule"></span>
        <button class="rail-button" data-page="discover" aria-label="发现"><svg><use href="#i-compass"/></svg></button><span class="rail-rule"></span>
        <button class="rail-button" data-page="settings" aria-label="设置"><svg><use href="#i-settings"/></svg></button>
      </nav>
    </aside>
    <section class="home-card">
      <div class="hero"><span class="hero-orbit one"></span><span class="hero-orbit two"></span><div class="portrait"><img src="/assets/hero.png" alt="落弦律首页插画" draggable="false"></div></div>
      <section class="overview">
        <p class="greeting" id="greeting">下午好</p>
        <h1 id="quote">天空你是否知晓一切？</h1>
        <button id="portal" class="portal" aria-label="进入演练场"><span class="portal-copy">演练场</span></button>
        <button id="running-status" class="running-status"><i></i><span>悬浮窗已关闭 · 点击开启</span></button>
        <div class="start-row"><button class="icon-button" id="home-settings" aria-label="首页设置"><svg><use href="#i-tune"/></svg></button><button id="start" class="start"><svg><use href="#i-play"/></svg><span>启动</span></button></div>
      </section>
      <footer>落弦律 · v1.0.7</footer>
    </section>
    <div id="snow" class="snow" aria-hidden="true"></div>
    <div class="gesture-bar"></div>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="stage-ui" class="stage-ui" inert>
    <div class="stage-toolbar"><button id="leave" class="stage-icon" aria-label="退出演练场"><svg><use href="#i-back"/></svg></button><button id="wallpapers" class="stage-icon" aria-label="选择壁纸"><svg><use href="#i-image"/></svg></button></div>
    <span class="stage-title">落弦律 · 演练场</span>
    <div id="key-targets"></div>
  </div>

  <section class="subpage" id="subpage" hidden>
    <header><button id="page-back" class="icon-button" aria-label="返回"><svg><use href="#i-back"/></svg></button><h2 id="page-title"></h2></header>
    <div id="page-content" class="page-content"></div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <div id="floating" class="floating" hidden><button id="float-play" aria-label="播放练习曲"><svg><use href="#i-play"/></svg></button><div><b>星光练习</b><small id="float-state">自然音 · 已暂停</small></div><button id="float-close" aria-label="关闭悬浮窗">×</button></div>
</main>
</div>
<div class="preview-tools rotation-tools">
  <div class="preview-brand">落弦律 <span>光核 · 自动转场</span></div>
  <div class="preview-actions"><span id="preview-status">点击「演练场」 · 全程自动</span><button id="replay">重新体验</button><button id="theme" title="切换深浅色"><svg><use href="#i-moon"/></svg></button></div>
</div>
<script src="app.js"></script>
</body>
</html>
